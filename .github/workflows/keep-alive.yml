# Keeps the Render free-tier backend warm so a reviewer's first request
# isn't hit with a 30-60s cold-start wake-up. Render's free web services
# spin down after ~15 minutes with no traffic; pinging /api/health every
# 10 minutes keeps it inside that window indefinitely, at no cost and with
# no new account (GitHub Actions is already free for a public repo).
#
# One-time setup: Settings -> Secrets and variables -> Actions -> Variables
# -> New repository variable -> name RENDER_HEALTH_URL, value
# https://<your-render-service>.onrender.com/api/health (from DEPLOYMENT.md
# step 1). Nothing else to configure - this runs on its own from then on.
#
# To pause it (e.g. once the review period is over and you don't want to
# keep the free-tier instance alive around the clock): Actions tab -> this
# workflow -> "..." -> Disable workflow.
name: Keep Render backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL repository variable is not set yet - skipping (see comment at top of this file for setup)."
            exit 0
          fi
          curl -sf --max-time 60 "$RENDER_HEALTH_URL" || echo "Ping failed or the service was cold-starting; this is non-fatal for a keep-warm job."
