# Render "Blueprint" - lets Render auto-provision this service from the repo
# instead of clicking through every field by hand. In the Render dashboard:
# New -> Blueprint -> pick this repo -> it reads this file automatically.
#
# NVIDIA_API_KEY and CORS_ALLOW_ORIGINS are deliberately NOT set here (no
# `value:`) - Render will prompt for them once at first deploy and store them
# as secrets; CORS_ALLOW_ORIGINS specifically can't be known until the Vercel
# frontend exists, so it gets filled in as a second step after that's up.
services:
  - type: web
    name: weather-advisory-bot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_FALLBACK_MODELS
        value: openai/gpt-oss-20b,nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_TIMEOUT
        value: "45"
      - key: CORS_ALLOW_ORIGINS
        sync: false
